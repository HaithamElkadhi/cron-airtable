# Daily Airtable prospect stats (and optional KPIS write) via API.
#
# Base id, table names, and the situation field are hardcoded defaults in main.py.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   AIRTABLE_PERSONAL_ACCESS_TOKEN   PAT: data.records:read (+ data.records:write if KPIS updates)
#                                    Access must include the Prospects and KPIS tables.
#
# Optional secrets:
#   KPI_RECORD_ID                    Set to PATCH that row; omit to POST a new row each run
#   UPDATE_KPIS                      Literal true or false (not prompt). Secret or Variable; secret wins.
#                                    Use true to write KPIS in CI; PAT needs data.records:write.

name: Daily Airtable stats

on:
  schedule:
    # 07:15 UTC daily — edit to your preferred UTC time
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: airtable-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airtable:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Airtable script
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          KPI_RECORD_ID: ${{ secrets.KPI_RECORD_ID }}
          # Secret wins over Variable; default false so scheduled runs do not write unless you opt in.
          UPDATE_KPIS: ${{ secrets.UPDATE_KPIS || vars.UPDATE_KPIS || 'false' }}
        run: python main.py
